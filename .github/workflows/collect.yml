name: collect-cards
# Hourly collection of every live model's cards straight from the public Hugging Face API (pipeline/qcl_collect.py):
# no connector and no agent. Commits models/*/cache and models/*/snapshots/index.json only when a card changed.
# The live-updates scan then runs `python3 pipeline/qcl_next.py --part A --collected` (docs/runbooks/HOURLY.md).
on:
  schedule:
    - cron: "1 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Collect every live model (catalogue, cards and trees at pinned sha; resumable, throttled)
        id: collect
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -o pipefail
          python3 pipeline/qcl_collect.py --all-live --workers 8 | tee "$RUNNER_TEMP/collect.jsonl"
      - name: Commit the changed ledgers and snapshots
        if: ${{ !cancelled() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        run: |
          git config user.name "quant-claims-bot"
          git config user.email "quant-claims-bot@users.noreply.github.com"
          git add -A -- 'models/*/cache' 'models/*/snapshots/index.json'
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          summary="$(python3 pipeline/qcl_collect.py --summary "$RUNNER_TEMP/collect.jsonl")"
          git commit -m "Collect $(date -u '+%Y-%m-%d %H:%M') UTC: $summary"
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "push failed after 3 attempts" >&2
          exit 1
