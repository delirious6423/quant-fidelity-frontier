# Verifies the selected commit and deploys that exact tested static artifact.
# Manual trigger only, so nothing goes public until the owner runs it (Settings > Pages > Source: GitHub Actions).
name: deploy-pages
run-name: deploy-pages ${{ inputs.expected_sha || github.sha }}
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Optional exact approved commit; reject an advanced branch"
        type: string
        required: false
        default: ""
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  approved-commit:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require the requested commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ -n "$EXPECTED_SHA" ] && [ "$EXPECTED_SHA" != "$GITHUB_SHA" ]; then
            echo "The branch advanced after approval; refusing a different commit." >&2
            exit 1
          fi
  verify:
    needs: approved-commit
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    with:
      publish_pages_artifact: true
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
