name: verify-claims
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow numpy playwright && python -m playwright install --with-deps chromium
      - name: Verbatim gate — every cited value appears on its cited snapshot line
        run: python3 verify.py
      - name: Column gate — table values sit under a header of the right metric
        run: python3 verify_columns.py
      - name: Image gate — transcribed chart values match marker and reference-line positions
        run: python3 verify_images.py
      - name: Build (refuses on any gate failure; plausibility and sign assertions)
        run: python3 build.py
      - name: Gate regression tests (external-review counterfactuals)
        run: python3 test_gates.py
      - name: Review regression checks (F1-F24)
        run: python3 test_claims.py
      - name: UI tests (explorer interactions, no horizontal scroll, no JS errors; desktop and phone)
        run: python3 test_ui.py
      - name: Committed site matches the data
        run: |
          diff -q site/index.html docs/index.html
          diff -q site/data.json docs/data.json
