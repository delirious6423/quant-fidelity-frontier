name: verify-claims
on:
  workflow_call:
    inputs:
      publish_pages_artifact:
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow numpy playwright && python -m playwright install --with-deps chromium
      - name: Assembly and workflow safety regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_assembly_safety.py'
          python3 -m unittest discover -s tests -p 'test_workflow_security.py'
          python3 tests/test_fetch_security.py
          python3 tests/test_gate_integrity.py
          python3 tests/test_source_pins.py
          python3 tests/test_mapping_provenance.py
          python3 tests/test_qa_release.py
          python3 tests/test_runner_state.py
          python3 tests/test_runner_fetch.py
          python3 tests/test_runner_model.py
          python3 tests/test_runner.py
          python3 tests/test_dispatch.py
          python3 tests/test_portable.py
      - name: Gates + build + UI tests, every live model (build.py refuses on any gate failure)
        run: |
          # on failure, the last lines also go out as annotations (readable from the API without the log archive)
          python3 pipeline/qcl_live.py > live-models.txt
          while IFS= read -r d; do
            { QCL_ROOT="$d" python3 build.py && QCL_SITE="$d/site" python3 tests/test_ui.py; } > step.log 2>&1 && continue
            cat step.log; grep -E "FAIL|Error|Traceback|MISMATCH" step.log | head -20 | sed "s|^|::error title=$d::|"; tail -5 step.log | sed "s|^|::error title=$d tail::|"; exit 1
          done < live-models.txt
      - name: Source-backed benchmarks and responsive interactions
        run: |
          python3 tests/test_benchmarks.py
          python3 tests/test_benchmark_integrity.py
          python3 tests/test_benchmarks_ui.py
          python3 tests/test_disclosures_ui.py
      - name: Benchmark screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-previews
          path: test-results/*-benchmarks-*.png
          if-no-files-found: ignore
      - name: Gate regression tests (external-review counterfactuals)
        run: python3 tests/test_gates.py
      - name: Review regression checks (F1-F24, Flash-Next)
        run: python3 tests/test_claims.py
      - name: Native-model ingestion, panel and column regressions
        run: |
          python3 tests/test_model_panels.py
          python3 tests/test_mapping_panels.py
          python3 tests/test_combined_columns.py
          python3 tests/test_qualifiers.py
          python3 tests/test_current.py
          python3 tests/test_column_caption.py
          python3 tests/test_readme.py
          python3 tests/test_rank.py
          python3 tests/test_size_types.py
          python3 tests/test_highlights_soft.py
          python3 tests/test_image_flag.py
          python3 tests/test_queue_skip.py
      - name: Assembled site is static only
        run: python3 assemble.py _site
      - name: Shared benchmark data and cross-model chart interactions
        run: |
          python3 tests/test_benchmark_view.py
          python3 tests/test_benchmark_extracted.py
      - name: README lists every live model and has no dead links (counts are refreshed by the QA worker)
        run: python3 pipeline/readme_sync.py --check --structure
      - name: Homepage layouts and quick-start links
        run: python3 tests/test_homepage.py
      - name: Model page layout and measurement-set preservation
        run: |
          python3 tests/test_model_redesign.py
          python3 tests/test_explorer_state.py
          python3 tests/test_web_payload.py
      - name: Discovery pages and dataset export
        run: python3 tests/test_discovery.py
      - name: Protocol comparison engine, source bindings, and cross-publisher groups
        run: |
          python3 -m unittest discover -s tests -p 'test_comparison.py'
          python3 -m unittest discover -s tests -p 'test_protocol_metadata.py'
          python3 -m unittest discover -s tests -p 'test_verified_protocol_sets.py'
          python3 tests/test_comparison_ui.py
      - name: MCP server answers match the data (stdio, black-box)
        run: pip install "mcp==2.3.0" && QFF_DATA=_site python3 tests/test_mcp.py
      - name: MCP protocol and provenance regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_mcp_comparison.py'
          python3 tests/test_mcp_loading.py
          python3 tests/test_mcp_benchmarks.py
          python3 tests/test_mcp_http.py
      - name: MCP 1.x transport compatibility
        run: |
          python3 -m venv /tmp/qff-mcp-v1
          /tmp/qff-mcp-v1/bin/pip install "mcp==1.30.0"
          QFF_DATA=_site /tmp/qff-mcp-v1/bin/python tests/test_mcp_http.py
      # A caller deploys this exact artifact only after every check above passes.
      # The local reusable workflow and checkout share the caller's immutable SHA.
      - name: Upload verified Pages artifact
        if: ${{ inputs.publish_pages_artifact == true }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
